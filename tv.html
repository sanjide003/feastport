<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss://*.firebaseio.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Live Stage TV — Feastport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Noto+Sans+Malayalam:wght@400;700&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; overflow: hidden; background: #0B1120; color: #F8FAFC; font-family: 'Plus Jakarta Sans', 'Noto Sans Malayalam', sans-serif; }
    h1, h2, h3, .font-display { font-family: 'Outfit', sans-serif; letter-spacing: -0.025em; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    @keyframes ticker { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    .ticker { animation: ticker 55s linear infinite; }
    @keyframes sceneIn { from { opacity: 0; transform: scale(0.97) translateY(20px); } to { opacity: 1; transform: none; } }
    @keyframes spotlight { from { opacity: 0; filter: blur(10px); transform: scale(1.06); } to { opacity: 1; filter: none; transform: none; } }
    @keyframes tickerRise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
    @keyframes confettiPop { 0% { opacity: 0; transform: scale(0.7); } 75% { transform: scale(1.03); } 100% { opacity: 1; transform: none; } }
    .scene-in { animation: sceneIn 0.55s ease-out both; }
    .scene-spotlight { animation: spotlight 0.7s ease-out both; }
    .scene-ticker-rise { animation: tickerRise 0.6s ease-out both; }
    .scene-confetti { animation: confettiPop 0.75s ease-out both; }
    .broadcast-card { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(148, 163, 184, 0.16); backdrop-filter: blur(12px); }
    .fullscreen-control { opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; transform: translate(-50%, -8px); }
    .fullscreen-zone:hover .fullscreen-control, .fullscreen-zone:focus-within .fullscreen-control { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .tv-section-hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="fullscreen-shell" class="relative flex h-screen w-screen flex-col overflow-hidden bg-[#0B1120]">
    <div id="bg" class="fixed inset-0 bg-[#0B1120] transition-all duration-700"></div>
    <video id="bg-video" class="fixed inset-0 hidden h-full w-full object-cover opacity-40" autoplay muted playsinline></video>
    <iframe id="bg-youtube" class="pointer-events-none fixed inset-0 hidden h-full w-full scale-[1.18] opacity-40" title="Stage Background Video" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="tv-overlay" class="fixed inset-0 bg-slate-950/65"></div>

    <main class="relative z-10 flex h-full flex-col p-6 lg:p-8">
      <!-- Top Broadcast Bar -->
      <header id="tv-header" class="mb-6 flex flex-wrap items-center justify-between gap-4 border-b border-slate-800/80 pb-5">
        <div class="flex items-center gap-4 min-w-0">
          <div id="tv-logo-section" class="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-xl border border-slate-700 bg-slate-900">
            <img id="tv-fest-logo" class="hidden h-full w-full object-cover" alt="Fest logo" referrerpolicy="no-referrer">
            <span id="tv-logo-fallback" class="font-display text-lg font-extrabold text-amber-400">FM</span>
          </div>
          <div id="tv-name-section" class="min-w-0">
            <h1 id="tv-title" class="truncate font-display text-4xl font-extrabold tracking-tight text-white lg:text-5xl">FEST LIVE</h1>
            <p id="tv-subtitle" class="mt-1 truncate text-base font-medium text-slate-400">Official results, team standings & announcements</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span class="inline-flex items-center gap-2 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-2 text-xs font-bold uppercase tracking-widest text-red-400">
            <span class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>Live
          </span>
          <div id="clock" class="rounded-xl border border-slate-800 bg-slate-900/90 px-5 py-3 font-mono-num text-2xl font-bold text-white lg:text-3xl">--:--</div>
        </div>
      </header>

      <!-- Main Stage Grid -->
      <section id="main-grid" class="grid min-h-0 flex-1 grid-cols-12 gap-5 overflow-hidden"></section>

      <!-- Fullscreen Result Reveal Takeover -->
      <div id="live-scene" class="fixed inset-0 z-40 hidden items-center justify-center bg-[#0B1120]/95 p-8"></div>
      <div id="queue-status" class="fixed right-8 top-8 z-50 hidden rounded-lg border border-amber-400/40 bg-amber-400 px-4 py-1.5 font-mono-num text-xs font-extrabold uppercase tracking-wider text-slate-950 shadow-xl"></div>

      <!-- Ticker -->
      <footer id="tv-ticker-section" class="mt-6 flex h-14 shrink-0 items-center overflow-hidden rounded-xl border border-blue-500/30 bg-blue-950/90">
        <div class="z-10 flex h-full shrink-0 items-center bg-blue-700 px-4 font-display text-xs font-extrabold uppercase tracking-widest text-white">Updates</div>
        <div class="min-w-0 flex-1 overflow-hidden">
          <div id="ticker" class="ticker whitespace-nowrap pl-[100%] text-lg font-bold tracking-wide text-slate-100">Welcome to Fest Live</div>
        </div>
      </footer>
    </main>

    <!-- Fullscreen Hover Trigger -->
    <div class="fullscreen-zone fixed left-1/2 top-0 z-[70] h-16 w-72 -translate-x-1/2">
      <button id="fullscreen-toggle" type="button" class="fullscreen-control absolute left-1/2 top-3 rounded-lg border border-slate-700 bg-slate-900/95 px-4 py-2 text-xs font-bold uppercase tracking-wider text-white shadow-xl" aria-pressed="false">Full Screen</button>
    </div>
    <div id="fullscreen-hint" class="pointer-events-none fixed left-1/2 top-16 z-[70] hidden -translate-x-1/2 rounded-lg bg-amber-400 px-4 py-2 text-xs font-bold text-slate-950 shadow-xl">Press F11 or allow fullscreen</div>
  </div>

  <script type="module">
    import { db, auth } from './firebase-config.js';
    import { cachedGetDocs, invalidateCache } from './data-cache.js';
    import { eventContributesToTeamScore, normalizeFestSetup } from './fest-config.js';
    import { normalizeBranding, brandingName, applyBase64Image } from './branding-config.js';
    import { collection, doc, onSnapshot, query, where } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
    import { signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';

    let tvConfig = {};
    let tvControl = {};
    let homeBranding = normalizeBranding();
    let results = [];
    let events = [];
    let teams = [];
    let teamDisplayNames = {};
    let categoryDisplayNames = {};
    let festSetup = normalizeFestSetup();
    const resultQueue = [];
    let presenting = false;
    let resultsReady = false;
    let controlRunId = 0;
    let lastDashboardHash = '';
    let slideIndex = 0;

    const PRESENTATION_TIMING = Object.freeze({
      programmeIntroSeconds: 5,
      revealSeconds: 5,
      resultSeconds: 8,
      slideSeconds: 10
    });

    const h = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    const defaults = () => ({
      title: homeBranding.configured ? `${brandingName(homeBranding)} LIVE` : 'FEST MANAGEMENT',
      ticker: homeBranding.configured ? `Welcome to ${brandingName(homeBranding)} • Live Results & Standings` : 'Live display is awaiting festival setup',
      show: { results: true, officialLatest: true, recentResults: true, leaderboard: true, announcements: true, media: true, videos: true, logo: true, name: true, subtitle: true, clock: true, ticker: true },
      background: { color: '#0B1120', imageUrl: '', videoUrl: '', slides: [], videos: [] },
      announcements: ['Stay tuned for official results and standings.'],
      interruptPolicy: 'after-current',
      sections: {}
    });

    const cfg = () => {
      const base = defaults();
      const controlContent = tvControl.content || {};
      const videoUrls = Array.isArray(tvControl.videoUrls) && tvControl.videoUrls.length
        ? tvControl.videoUrls.filter(Boolean)
        : [tvControl.videoUrl].filter(Boolean);
      return {
        title: tvConfig.title || base.title,
        ticker: tvConfig.ticker || base.ticker,
        show: { ...base.show, ...(tvConfig.show || {}), ...controlContent },
        background: { ...base.background, ...(tvConfig.background || {}) },
        control: {
          mode: tvControl.mode || 'dashboard',
          animationStyle: tvControl.animationStyle || 'cinematic',
          selectedResultIds: Array.isArray(tvControl.selectedResultIds) ? tvControl.selectedResultIds : [],
          videoUrls,
          imageUrls: Array.isArray(tvControl.imageUrls) ? tvControl.imageUrls : []
        },
        announcements: Array.isArray(tvConfig.announcements) && tvConfig.announcements.length ? tvConfig.announcements : base.announcements,
        timing: PRESENTATION_TIMING,
        interruptPolicy: tvControl.interruptPolicy || tvConfig.interruptPolicy || base.interruptPolicy,
        sections: { ...(base.sections || {}), ...(tvConfig.sections || {}), ...(tvControl.sections || {}) }
      };
    };

    const teamName = (value) => String(teamDisplayNames?.[value] || value || 'Team');
    const categoryName = (value) => String(categoryDisplayNames?.[value] || value || 'General');
    const animationClass = () => ({ spotlight: 'scene-spotlight', 'ticker-rise': 'scene-ticker-rise', confetti: 'scene-confetti' }[cfg().control.animationStyle] || 'scene-in');
    const resultEvent = (r) => events.find((e) => e.id === r.eventId) || r;
    const resultType = (r) => resultEvent(r).type || r.type || 'Single';
    const resultCancelled = (r) => resultEvent(r).cancelled === true || r.cancelled === true;
    const winnerDetail = (r, id) => r.winnerDetails?.[id] || {};
    const winnerTeam = (r, id) => winnerDetail(r, id).team || (resultType(r) === 'Group' ? id : '');
    const publishedResults = () => results.filter((r) => !r.status || r.status === 'published');
    const timeValue = (v) => (typeof v?.toMillis === 'function' ? v.toMillis() : typeof v?.seconds === 'number' ? v.seconds * 1000 : Number(v || 0));
    const publishTime = (r) => timeValue(r.publishedAt || r.updatedAt || r.timestamp);
    const fmtTime = (t) => (t ? new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(new Date(t)) : 'Live');
    const eventName = (r) => resultEvent(r).name || r.eventName || 'Event';
    const eventMeta = (r) => {
      const e = resultEvent(r);
      return {
        name: eventName(r),
        category: categoryName(r.category || e.category || 'General'),
        stage: r.stage || e.stage || 'Main Stage',
        gender: r.gender || e.gender || 'Open',
        type: resultType(r)
      };
    };

    const resultPlaces = (r) => {
      if (Array.isArray(r.places) && r.places.length) {
        return r.places.map((p, i) => ({
          label: p.label || ['First', 'Second', 'Third'][i] || `Position ${i + 1}`,
          winners: p.winners || [],
          value: p.earnedValue ?? p.value ?? 0
        }));
      }
      return [['first', 'First'], ['second', 'Second'], ['third', 'Third']]
        .map(([key, label]) => ({
          label,
          winners: Array.isArray(r.winners?.[key]) ? r.winners[key] : [r.winners?.[key]].filter(Boolean),
          value: r.points?.[key] || 0
        }))
        .filter((p) => p.winners.length);
    };

    const winnerProfiles = (r, place) => (place.winners || []).map((rawId) => {
      const id = typeof rawId === 'object' ? (rawId.id || '') : String(rawId || '');
      const detail = typeof rawId === 'object' ? rawId : winnerDetail(r, id);
      const isGroup = resultType(r) === 'Group';
      const team = teamName(detail.team || winnerTeam(r, id));
      return {
        id,
        isGroup,
        team,
        name: detail.name || (isGroup ? team : id) || 'Winner',
        photo: detail.photoUrl || detail.photoData || '',
        chest: detail.chestNo || '—'
      };
    });

    const primaryWinner = (r) => {
      const firstPlace = resultPlaces(r)[0] || { winners: [], value: 0, label: 'First' };
      return winnerProfiles(r, firstPlace)[0] || { name: 'Winner', team: 'Team', chest: '—', photo: '' };
    };

    function scores() {
      const map = {};
      teams.forEach((t) => { map[t] = 0; });
      const add = (r, winner, pts) => {
        const value = Number(pts || 0);
        const id = typeof winner === 'object' ? winner.id : winner;
        const team = typeof winner === 'object' && winner.team ? winner.team : winnerTeam(r, id);
        if (!id || !value || !team || team === '-') return;
        map[team] = (map[team] || 0) + value;
      };
      publishedResults().filter((r) => !resultCancelled(r)).forEach((r) => {
        if (!eventContributesToTeamScore(resultEvent(r), festSetup)) return;
        if (Array.isArray(r.places) || Array.isArray(r.gradeAwards)) {
          (r.places || []).forEach((p) => (p.winners || []).forEach((w) => add(r, w, p.earnedValue ?? p.value)));
          (r.gradeAwards || []).forEach((g) => (g.winners || []).forEach((w) => add(r, w, g.value)));
        }
      });
      return Object.entries(map).sort((a, b) => b[1] - a[1]);
    }

    function youtubeEmbed(value, loop = true) {
      try {
        const url = new URL(value);
        const host = url.hostname.replace(/^www\./, '');
        let id = '';
        if (host === 'youtu.be') id = url.pathname.split('/').filter(Boolean)[0] || '';
        else if (['youtube.com', 'm.youtube.com', 'music.youtube.com'].includes(host)) {
          if (url.pathname === '/watch') id = url.searchParams.get('v') || '';
          else if (/^\/(shorts|embed|live)\//.test(url.pathname)) id = url.pathname.split('/')[2] || '';
        }
        if (!/^[a-zA-Z0-9_-]{6,15}$/.test(id)) return '';
        const q = new URLSearchParams({ autoplay: '1', mute: '1', controls: '0', playsinline: '1', rel: '0', modestbranding: '1', enablejsapi: '1', origin: location.origin });
        if (loop) { q.set('loop', '1'); q.set('playlist', id); }
        return `https://www.youtube.com/embed/${id}?${q}`;
      } catch {
        return '';
      }
    }

    const sectionVisible = (c, key, legacy) => c.show?.[key] !== false && c.sections?.[key]?.visible !== false && (legacy ? c.show?.[legacy] !== false : true);
    const sectionOrder = (c, key, fallback) => Number(c.sections?.[key]?.order || fallback);

    function applySectionLayout(c) {
      const map = { logo: 'tv-logo-section', name: 'tv-name-section', subtitle: 'tv-subtitle', clock: 'clock', ticker: 'tv-ticker-section' };
      Object.entries(map).forEach(([key, id]) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('tv-section-hidden', c.show?.[key] === false || c.sections?.[key]?.visible === false);
      });
    }

    function renderHeroResult(r) {
      if (!r) {
        return `
          <div class="col-span-12 lg:col-span-8 broadcast-card flex flex-col justify-center rounded-2xl p-8 scene-in">
            <p class="text-xs font-extrabold uppercase tracking-[0.25em] text-amber-400">Official Result Desk</p>
            <h2 class="mt-4 font-display text-4xl font-extrabold text-white lg:text-5xl">Awaiting Published Results</h2>
            <p class="mt-3 text-lg text-slate-400">Published results and team points will appear automatically.</p>
          </div>
        `;
      }
      const m = eventMeta(r);
      const w = primaryWinner(r);
      const places = resultPlaces(r);
      return `
        <div class="col-span-12 lg:col-span-8 broadcast-card flex flex-col justify-between rounded-2xl p-7 scene-in overflow-hidden">
          <div class="flex items-start justify-between gap-4">
            <div>
              <p class="text-xs font-extrabold uppercase tracking-[0.25em] text-amber-400">Latest Published Result</p>
              <h2 class="mt-2 font-display text-4xl font-extrabold leading-tight text-white lg:text-5xl">${h(m.name)}</h2>
              <div class="mt-3 flex flex-wrap gap-2 text-xs font-bold uppercase tracking-wider text-slate-300">
                <span class="rounded border border-slate-700 bg-slate-800/80 px-3 py-1">${h(m.category)}</span>
                <span class="rounded border border-slate-700 bg-slate-800/80 px-3 py-1">${h(m.stage)}</span>
                <span class="rounded border border-slate-700 bg-slate-800/80 px-3 py-1">${h(m.gender)}</span>
                <span class="rounded border border-slate-700 bg-slate-800/80 px-3 py-1">${h(m.type)}</span>
              </div>
            </div>
            <span class="rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-4 py-2 font-mono-num text-sm font-bold text-emerald-300">${h(fmtTime(publishTime(r)))}</span>
          </div>

          <div class="mt-6 flex items-center gap-6 rounded-xl border border-slate-800 bg-slate-900/80 p-5">
            ${w.photo
              ? `<img src="${h(w.photo)}" class="h-28 w-28 shrink-0 rounded-xl border-2 border-amber-400 object-cover" alt="Winner" referrerpolicy="no-referrer">`
              : `<div class="flex h-28 w-28 shrink-0 items-center justify-center rounded-xl bg-amber-400 font-display text-5xl font-extrabold text-slate-950">${h((w.name || 'W').charAt(0))}</div>`}
            <div class="min-w-0">
              <p class="text-sm font-extrabold uppercase tracking-wider text-amber-400">${h(places[0]?.label || 'First')}</p>
              <h3 class="mt-1 truncate font-display text-4xl font-extrabold text-white">${h(w.name)}</h3>
              <p class="mt-2 text-lg font-semibold text-slate-300">Chest <span class="font-mono-num text-white">${h(w.chest)}</span> • ${h(w.team)} • <span class="font-mono-num text-emerald-400">+${h(places[0]?.value || 0)} pts</span></p>
            </div>
          </div>

          ${places.length > 1 ? `
            <div class="mt-4 grid gap-3 sm:grid-cols-2">
              ${places.slice(1, 3).map((p) => {
                const prof = winnerProfiles(r, p)[0];
                if (!prof) return '';
                return `
                  <div class="flex items-center justify-between rounded-xl border border-slate-800 bg-slate-900/60 px-4 py-3">
                    <div class="min-w-0">
                      <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">${h(p.label)}</p>
                      <p class="truncate text-base font-bold text-white">${h(prof.name)}</p>
                      <p class="truncate text-xs text-slate-400">${h(prof.team)}</p>
                    </div>
                    <span class="font-mono-num text-sm font-bold text-blue-400">+${h(p.value || 0)}</span>
                  </div>
                `;
              }).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderLeaderboardCard() {
      const rows = scores().slice(0, 8);
      return `
        <div class="col-span-12 lg:col-span-4 broadcast-card flex flex-col rounded-2xl p-6 overflow-hidden">
          <div class="flex items-center justify-between">
            <h2 class="font-display text-2xl font-extrabold text-white">Team Standings</h2>
            <span class="rounded border border-blue-500/30 bg-blue-500/10 px-2.5 py-1 font-mono-num text-[11px] font-bold text-blue-300">POINTS</span>
          </div>
          <div class="mt-4 space-y-2.5 overflow-y-auto pr-1">
            ${rows.length ? rows.map(([team, pts], i) => `
              <div class="flex items-center justify-between rounded-xl px-4 py-3 ${i === 0 ? 'bg-amber-400 text-slate-950' : 'border border-slate-800 bg-slate-900/80 text-white'}">
                <span class="truncate font-display text-lg font-bold">#${i + 1} ${h(teamName(team))}</span>
                <span class="font-mono-num text-xl font-extrabold">${h(pts)}</span>
              </div>
            `).join('') : '<p class="text-sm text-slate-400">No team points yet.</p>'}
          </div>
        </div>
      `;
    }

    function renderRecentResults(rows) {
      return `
        <div class="col-span-12 lg:col-span-4 broadcast-card flex flex-col rounded-2xl p-6 overflow-hidden">
          <h2 class="font-display text-xl font-extrabold text-white">Recent Results</h2>
          <div class="mt-4 space-y-2.5 overflow-y-auto pr-1">
            ${rows.slice(0, 4).map((r) => {
              const m = eventMeta(r);
              const w = primaryWinner(r);
              return `
                <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-4 py-3">
                  <div class="flex items-center justify-between gap-2">
                    <p class="truncate text-sm font-bold text-white">${h(m.name)}</p>
                    <span class="font-mono-num text-[11px] text-slate-400">${h(fmtTime(publishTime(r)))}</span>
                  </div>
                  <p class="mt-1 truncate text-sm font-semibold text-amber-300">${h(w.name)}</p>
                  <p class="text-xs text-slate-400">${h(w.team)} • ${h(m.category)}</p>
                </div>
              `;
            }).join('') || '<p class="text-sm text-slate-400">No recent results yet.</p>'}
          </div>
        </div>
      `;
    }

    function renderAnnouncement(c) {
      const message = c.announcements[slideIndex % Math.max(1, c.announcements.length)] || 'Stay tuned for live updates.';
      return `
        <div class="col-span-12 lg:col-span-4 broadcast-card flex flex-col justify-center rounded-2xl p-6">
          <p class="text-xs font-extrabold uppercase tracking-[0.25em] text-blue-400">Announcement</p>
          <p class="mt-3 font-display text-2xl font-bold leading-snug text-white">${h(message)}</p>
        </div>
      `;
    }

    function renderMediaFocus(c) {
      const media = [
        ...(c.background.slides || []).map((url) => ({ type: 'image', url })),
        ...(c.show.videos === true ? (c.background.videos || []) : []).map((url) => ({ type: 'video', url }))
      ];
      const item = media[slideIndex % Math.max(1, media.length)];
      return `
        <div class="col-span-12 lg:col-span-4 broadcast-card flex flex-col rounded-2xl p-5 overflow-hidden">
          <p class="mb-3 text-xs font-extrabold uppercase tracking-[0.2em] text-slate-400">Stage Media</p>
          ${item ? (
            item.type === 'video'
              ? (youtubeEmbed(item.url, false)
                  ? `<iframe src="${h(youtubeEmbed(item.url, false))}" class="h-44 w-full flex-1 rounded-xl" title="Media Video" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>`
                  : `<video src="${h(item.url)}" class="h-44 w-full flex-1 rounded-xl object-cover" autoplay muted playsinline></video>`)
              : `<img src="${h(item.url)}" class="h-44 w-full flex-1 rounded-xl object-cover" alt="Stage Slide" referrerpolicy="no-referrer">`
          ) : '<div class="flex flex-1 items-center justify-center rounded-xl border border-dashed border-slate-800 text-xs font-semibold text-slate-500">No stage media configured</div>'}
        </div>
      `;
    }

    const controlPlaylistActive = () => {
      const c = cfg();
      return c.show.videos === true && ['video-only', 'media'].includes(c.control.mode) && c.control.videoUrls.length > 0;
    };

    function render() {
      const c = cfg();
      const videoOnly = c.control.mode === 'video-only';
      document.querySelector('main').classList.toggle('hidden', videoOnly);
      document.getElementById('tv-overlay')?.classList.toggle('hidden', videoOnly);
      document.getElementById('tv-title').textContent = c.title;
      document.getElementById('ticker').textContent = c.ticker;
      applySectionLayout(c);

      const bg = document.getElementById('bg');
      bg.style.background = c.background.imageUrl ? `url('${c.background.imageUrl}') center/cover` : c.background.color;

      const controlMedia = ['video-only', 'media'].includes(c.control.mode);
      const videoEnabled = c.show.videos === true;
      const playlist = controlMedia && c.control.videoUrls.length ? c.control.videoUrls : [c.background.videoUrl].filter(Boolean);
      const activeVideo = videoEnabled ? playlist[slideIndex % Math.max(1, playlist.length)] : '';
      const video = document.getElementById('bg-video');
      const youtube = document.getElementById('bg-youtube');
      const ytUrl = videoEnabled ? youtubeEmbed(activeVideo, playlist.length <= 1) : '';

      if (ytUrl) {
        video.pause(); video.removeAttribute('src'); video.classList.add('hidden');
        if (youtube.dataset.source !== activeVideo) { youtube.src = ytUrl; youtube.dataset.source = activeVideo; }
        youtube.classList.remove('hidden');
      } else if (activeVideo && videoEnabled) {
        youtube.removeAttribute('src'); delete youtube.dataset.source; youtube.classList.add('hidden');
        video.loop = playlist.length <= 1;
        if (video.dataset.source !== activeVideo) { video.src = activeVideo; video.dataset.source = activeVideo; }
        video.classList.remove('hidden');
        video.play().catch(() => {});
      } else {
        video.pause(); video.removeAttribute('src'); delete video.dataset.source; video.classList.add('hidden');
        youtube.removeAttribute('src'); delete youtube.dataset.source; youtube.classList.add('hidden');
      }

      if (videoOnly) {
        const imgUrl = c.control.imageUrls[slideIndex % Math.max(1, c.control.imageUrls.length)];
        bg.style.background = imgUrl ? `url('${imgUrl}') center/cover` : '#000';
        return;
      }

      const recent = publishedResults().slice().sort((a, b) => publishTime(b) - publishTime(a));
      const cards = [];
      if (sectionVisible(c, 'officialLatest', 'results')) cards.push({ order: sectionOrder(c, 'officialLatest', 1), html: renderHeroResult(recent[0]) });
      if (sectionVisible(c, 'leaderboard')) cards.push({ order: sectionOrder(c, 'leaderboard', 2), html: renderLeaderboardCard() });
      if (sectionVisible(c, 'recentResults', 'results')) cards.push({ order: sectionOrder(c, 'recentResults', 3), html: renderRecentResults(recent.slice(1)) });
      if (sectionVisible(c, 'announcements')) cards.push({ order: sectionOrder(c, 'announcements', 4), html: renderAnnouncement(c) });
      if (sectionVisible(c, 'media')) cards.push({ order: sectionOrder(c, 'media', 5), html: renderMediaFocus(c) });

      const html = cards.sort((a, b) => a.order - b.order).map((card) => card.html).join('') || '<div class="col-span-12 broadcast-card rounded-2xl p-10 text-center font-display text-3xl font-bold">No TV sections enabled</div>';
      const hash = html + c.title + c.ticker + JSON.stringify(c.sections);
      if (hash !== lastDashboardHash && !presenting) {
        document.getElementById('main-grid').innerHTML = html;
        lastDashboardHash = hash;
      }
    }

    async function showQueuedResults() {
      if (presenting || !resultQueue.length || cfg().control.mode !== 'results') return;
      presenting = true;
      const scene = document.getElementById('live-scene');
      const status = document.getElementById('queue-status');
      scene.classList.remove('hidden'); scene.classList.add('flex');
      status.classList.remove('hidden');

      const batch = [...resultQueue];
      resultQueue.length = 0;
      for (let i = 0; i < batch.length; i++) {
        const res = batch[i];
        const m = eventMeta(res);
        const places = resultPlaces(res);
        status.textContent = `LIVE RESULT ${i + 1} / ${batch.length}`;
        scene.innerHTML = `
          <section class="${animationClass()} w-full max-w-5xl text-center">
            <p class="text-sm font-extrabold uppercase tracking-[0.35em] text-amber-400">Official Result</p>
            <h2 class="mt-4 font-display text-6xl font-extrabold text-white lg:text-7xl">${h(m.name)}</h2>
            <p class="mt-4 text-xl font-semibold text-slate-300">${h(m.category)} • ${h(m.stage)} • ${h(m.gender)}</p>
          </section>
        `;
        await sleep(cfg().timing.programmeIntroSeconds * 1000);

        const revealOrder = [places[2], places[1], places[0]].filter(Boolean);
        for (const place of revealOrder) {
          const profiles = winnerProfiles(res, place);
          scene.innerHTML = `
            <section class="${animationClass()} w-full max-w-5xl text-center">
              <p class="text-xl font-extrabold uppercase tracking-[0.25em] text-amber-400">${h(place.label)}</p>
              <h2 class="mt-2 font-display text-4xl font-extrabold text-white">${h(m.name)}</h2>
              <div class="mt-8 grid gap-5 ${profiles.length > 1 ? 'md:grid-cols-2' : 'place-items-center'}">
                ${profiles.map((p) => `
                  <div class="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-900 p-6 text-center">
                    ${p.photo ? `<img src="${h(p.photo)}" class="mx-auto h-32 w-32 rounded-xl object-cover border-2 border-amber-400" alt="Winner" referrerpolicy="no-referrer">` : `<div class="mx-auto flex h-32 w-32 items-center justify-center rounded-xl bg-amber-400 font-display text-5xl font-extrabold text-slate-950">${h((p.name || 'W').charAt(0))}</div>`}
                    <h3 class="mt-4 font-display text-3xl font-extrabold text-white">${h(p.name)}</h3>
                    <p class="mt-2 text-base font-semibold text-slate-300">Chest ${h(p.chest)} • ${h(p.team)}</p>
                    <p class="mt-2 font-mono-num text-xl font-extrabold text-emerald-400">+${h(place.value || 0)} pts</p>
                  </div>
                `).join('')}
              </div>
            </section>
          `;
          await sleep(cfg().timing.revealSeconds * 1000);
        }
        if (resultQueue.length) batch.push(...resultQueue.splice(0));
      }

      status.classList.add('hidden');
      scene.classList.add('hidden'); scene.classList.remove('flex');
      presenting = false;
      lastDashboardHash = '';
      render();
    }

    function controlledResults() {
      const order = new Map(cfg().control.selectedResultIds.map((id, idx) => [id, idx]));
      return publishedResults().filter((r) => order.has(r.eventId)).sort((a, b) => order.get(a.eventId) - order.get(b.eventId));
    }

    function startSelectedControlSequence() {
      if (!resultsReady || cfg().control.mode !== 'results') return;
      const selected = controlledResults();
      if (!selected.length) return;
      const runId = controlRunId;
      resultQueue.push(...selected);
      const delay = cfg().interruptPolicy === 'immediate' ? 0 : cfg().timing.slideSeconds * 1000;
      setTimeout(() => { if (runId === controlRunId) showQueuedResults(); }, delay);
    }

    async function ensureEventsLoaded(incomingResults = []) {
      if (!events.length) {
        events = await cachedGetDocs(collection(db, 'events'), { cacheKey: 'tv_events', ttlMs: 300000 }).catch(() => []);
      } else if (incomingResults.some((r) => r.eventId && !events.some((e) => e.id === r.eventId))) {
        invalidateCache('tv_events');
        events = await cachedGetDocs(collection(db, 'events'), { cacheKey: 'tv_events', ttlMs: 300000 }).catch(() => events);
      }
    }

    // Fullscreen helpers
    const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    async function toggleFullscreen() {
      const root = document.getElementById('fullscreen-shell') || document.documentElement;
      try {
        if (fullscreenElement()) await document.exitFullscreen?.();
        else await root.requestFullscreen?.();
      } catch {
        const hint = document.getElementById('fullscreen-hint');
        hint?.classList.remove('hidden');
        setTimeout(() => hint?.classList.add('hidden'), 3500);
      }
    }
    document.getElementById('fullscreen-toggle')?.addEventListener('click', toggleFullscreen);
    document.addEventListener('keydown', (e) => { if (e.key?.toLowerCase() === 'f' && !e.metaKey && !e.ctrlKey && !e.altKey) toggleFullscreen(); });

    setInterval(() => {
      const el = document.getElementById('clock');
      if (el) el.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    setInterval(() => {
      if (!controlPlaylistActive()) {
        slideIndex++;
        if (!presenting) { lastDashboardHash = ''; render(); }
      }
    }, PRESENTATION_TIMING.slideSeconds * 1000);

    // Live listeners ONLY on TV config/control, branding, general, and published results (ZERO students/registrations listeners)
    ensureEventsLoaded().then(() => render());
    onSnapshot(doc(db, 'settings', 'tv_config'), (s) => { tvConfig = s.data() || {}; render(); });
    onSnapshot(doc(db, 'settings', 'tv_control'), (s) => { tvControl = s.data() || {}; controlRunId++; resultQueue.length = 0; lastDashboardHash = ''; render(); startSelectedControlSequence(); });
    onSnapshot(doc(db, 'settings', 'home_config'), (s) => {
      homeBranding = normalizeBranding(s.data() || {});
      applyBase64Image(document.getElementById('tv-fest-logo'), homeBranding.logoUrl, document.getElementById('tv-logo-fallback'));
      document.title = `${brandingName(homeBranding)} — Live TV`;
      render();
    });
    onSnapshot(doc(db, 'settings', 'general'), (s) => {
      const data = s.data() || {};
      teams = data.teams || [];
      teamDisplayNames = data.teamDisplayNames || {};
      categoryDisplayNames = data.categoryDisplayNames || {};
      festSetup = normalizeFestSetup(data.festSetup || {});
      render();
    });
    onSnapshot(query(collection(db, 'results'), where('status', '==', 'published')), async (snap) => {
      results = snap.docs.map((d) => ({ eventId: d.id, ...d.data() }));
      await ensureEventsLoaded(results);
      const wasReady = resultsReady;
      resultsReady = true;
      if (!wasReady) startSelectedControlSequence();
      if (!presenting) render();
    });
    signInAnonymously(auth).catch(() => {});
  </script>
</body>
</html>
