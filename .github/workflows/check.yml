name: Portal checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: npm run styles && git diff --exit-code -- styles/festival.css
      - run: npm run check
      - run: node scripts/http-check.mjs
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions
      - name: Exercise the seeded emulator project
        run: |
          export FEASTPORT_DEMO_PASSWORD="$(openssl rand -hex 16)"
          npx --yes firebase-tools@14.27.0 emulators:exec --project demo-feastport --only auth,firestore,functions 'node scripts/seed-demo.mjs && node scripts/demo-check.mjs'
