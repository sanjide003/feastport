<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' https://cdn.tailwindcss.com https://unpkg.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: wss://*.firebaseio.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Judge Desk — Festival Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Malayalam:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.25.0" defer></script>
  <script src="./dependency-loader.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans Malayalam', sans-serif; background: #F8FAFC; color: #0F172A; }
    h1, h2, h3, .font-display { font-family: 'Outfit', 'Plus Jakarta Sans', 'Noto Sans Malayalam', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .judge-menu-item.active { background: #EFF6FF; color: #1D4ED8; font-weight: 600; }
  </style>
</head>
<body class="min-h-screen flex flex-col lg:flex-row bg-[#F8FAFC] text-[#0F172A] antialiased">
  <div id="judge-overlay" data-app-sidebar-backdrop class="hidden"></div>

  <aside id="judge-sidebar" data-app-sidebar class="flex flex-col border-r border-slate-200 bg-white">
    <div data-sidebar-header class="flex h-16 items-center justify-between gap-2 border-b border-slate-200 px-4">
      <div class="flex min-w-0 items-center gap-3">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center overflow-hidden rounded-lg border border-slate-200 bg-slate-50">
          <img id="judge-fest-logo" class="hidden h-full w-full object-cover" alt="Fest logo" referrerpolicy="no-referrer">
          <span id="judge-logo-fallback" class="font-display text-xs font-bold text-blue-700">FM</span>
        </div>
        <div data-sidebar-hide-collapsed class="min-w-0">
          <p id="judge-fest-name" data-judge-fest-name class="truncate text-xs font-semibold text-blue-700">Fest Management</p>
          <p class="truncate text-xs font-bold text-slate-900">Judge Desk</p>
        </div>
      </div>
      <button type="button" data-sidebar-close class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-900 lg:hidden" aria-label="Close menu">
        <i data-lucide="x" class="h-4 w-4"></i>
      </button>
    </div>

    <nav data-sidebar-nav class="flex-1 space-y-1 overflow-y-auto p-3" aria-label="Judge sections menu">
      <button data-judge-tab="dashboard" data-sidebar-item class="judge-tab judge-menu-item active flex w-full items-center gap-2.5 rounded-lg px-3 py-2.5 text-left text-sm text-slate-600 hover:bg-slate-50">
        <i data-lucide="layout-dashboard" class="h-4 w-4 shrink-0"></i>
        <span data-sidebar-label class="truncate">Overview</span>
      </button>
      <button data-judge-tab="assignments" data-sidebar-item class="judge-tab judge-menu-item flex w-full items-center gap-2.5 rounded-lg px-3 py-2.5 text-left text-sm text-slate-600 hover:bg-slate-50">
        <i data-lucide="clipboard-list" class="h-4 w-4 shrink-0"></i>
        <span data-sidebar-label class="truncate">Assigned Events</span>
      </button>
      <button data-judge-tab="drafts" data-sidebar-item class="judge-tab judge-menu-item flex w-full items-center gap-2.5 rounded-lg px-3 py-2.5 text-left text-sm text-slate-600 hover:bg-slate-50">
        <i data-lucide="file-pen-line" class="h-4 w-4 shrink-0"></i>
        <span data-sidebar-label class="truncate">Drafts</span>
      </button>
      <button data-judge-tab="submitted" data-sidebar-item class="judge-tab judge-menu-item flex w-full items-center gap-2.5 rounded-lg px-3 py-2.5 text-left text-sm text-slate-600 hover:bg-slate-50">
        <i data-lucide="badge-check" class="h-4 w-4 shrink-0"></i>
        <span data-sidebar-label class="truncate">Submitted</span>
      </button>
      <button data-judge-action="open-profile" data-sidebar-item class="judge-menu-item flex w-full items-center gap-2.5 rounded-lg px-3 py-2.5 text-left text-sm text-slate-600 hover:bg-slate-50">
        <i data-lucide="user-round" class="h-4 w-4 shrink-0"></i>
        <span data-sidebar-label class="truncate">Profile</span>
      </button>
    </nav>

    <div data-sidebar-footer class="border-t border-slate-200 p-3 space-y-2">
      <a href="index.html" data-sidebar-item class="flex w-full items-center gap-2.5 rounded-lg border border-slate-200 bg-white px-3 py-2 text-left text-xs font-semibold text-slate-700 hover:bg-slate-50">
        <i data-lucide="home" class="h-4 w-4 shrink-0"></i>
        <span data-sidebar-label class="truncate">Public Home</span>
      </a>
      <button data-judge-action="logout" data-sidebar-item class="flex w-full items-center gap-2.5 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-left text-xs font-semibold text-red-700 hover:bg-red-100">
        <i data-lucide="log-out" class="h-4 w-4 shrink-0"></i>
        <span data-sidebar-label class="truncate">Sign Out</span>
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white">
      <div class="flex h-16 items-center justify-between gap-3 px-4 sm:px-6">
        <div class="flex items-center gap-3 min-w-0">
          <button type="button" data-sidebar-toggle class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50" aria-label="Toggle sidebar">
            <i data-lucide="menu" class="h-4 w-4 lg:hidden"></i>
            <i data-lucide="panel-left-close" data-toggle-icon-desktop class="hidden h-4 w-4 lg:block"></i>
          </button>
          <div class="min-w-0">
            <h1 id="judge-title" class="truncate font-display text-lg font-bold text-slate-900">Judge Desk</h1>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <a href="index.html" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 whitespace-nowrap">Public Home</a>
        </div>
      </div>
    </header>

    <main class="mx-auto w-full max-w-6xl flex-1 p-4 sm:p-6">
      <div id="judge-page-state" class="mb-4 rounded-xl border border-blue-200 bg-blue-50 p-4 text-xs font-semibold text-blue-800">Loading judge workspace…</div>
      <section id="desk-view">
        <div id="judge-summary" class="mb-6 grid grid-cols-2 gap-4 lg:grid-cols-4"></div>
        <div id="assigned-events" class="judge-panel hidden space-y-4"></div>
        <div id="judge-drafts" class="judge-panel hidden space-y-4"></div>
        <div id="judge-submitted" class="judge-panel hidden space-y-4"></div>
        <div id="judge-workspace" class="judge-panel hidden space-y-4"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 z-[70] rounded-lg bg-slate-900 px-4 py-2.5 text-xs font-semibold text-white opacity-0 shadow-lg transition-opacity pointer-events-none">Saved</div>

  <div id="judge-submit-modal" class="fixed inset-0 z-[80] hidden items-center justify-center bg-slate-950/60 p-4" role="dialog" aria-modal="true" aria-labelledby="judge-submit-title">
    <button data-judge-action="cancel-submit" class="absolute inset-0" aria-label="Close submission review"></button>
    <div class="relative z-10 w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-xl">
      <h3 id="judge-submit-title" class="font-display text-lg font-bold text-slate-900">Confirm Score Submission</h3>
      <div id="judge-submit-summary" class="mt-4 space-y-2 rounded-lg bg-slate-50 p-3 text-xs text-slate-700"></div>
      <div id="judge-submit-error" class="mt-3 hidden rounded-lg bg-red-50 p-3 text-xs font-semibold text-red-700"></div>
      <p class="mt-3 rounded-lg border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800">Submitted sheets are locked immediately. Only an Admin can reopen them for correction.</p>
      <div class="mt-5 flex justify-end gap-2">
        <button data-judge-action="cancel-submit" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-xs font-semibold text-slate-700">Cancel</button>
        <button data-judge-action="confirm-submit" class="judge-submit-button rounded-lg bg-emerald-600 px-4 py-2 text-xs font-semibold text-white hover:bg-emerald-700">Submit &amp; Lock</button>
      </div>
    </div>
  </div>

  <div id="judge-profile-modal" class="fixed inset-0 z-[85] hidden items-center justify-center bg-slate-950/60 p-4" role="dialog" aria-modal="true" aria-labelledby="judge-profile-name">
    <button data-judge-action="close-profile" class="absolute inset-0" aria-label="Close judge profile"></button>
    <article class="relative z-10 w-full max-w-sm rounded-xl border border-slate-200 bg-white p-6 text-center shadow-xl">
      <button data-judge-action="close-profile" class="absolute right-4 top-4 text-slate-400 hover:text-slate-700" aria-label="Close profile">
        <i data-lucide="x" class="h-4 w-4"></i>
      </button>
      <div class="mx-auto h-20 w-20 overflow-hidden rounded-full border border-slate-200 bg-slate-50">
        <img id="judge-profile-photo" class="h-full w-full object-cover opacity-0 transition-opacity duration-300" alt="Judge profile" referrerpolicy="no-referrer">
      </div>
      <p class="mt-3 text-xs font-semibold uppercase tracking-wider text-blue-700">Official Judge</p>
      <h2 id="judge-profile-name" class="mt-1 truncate font-display text-xl font-bold text-slate-900">Judge</h2>
      <div class="mt-4 grid grid-cols-2 gap-3 border-t border-slate-100 pt-4 text-xs">
        <div class="rounded-lg bg-slate-50 p-2.5">
          <span class="block text-slate-400">Username</span>
          <strong id="judge-profile-id" class="mt-0.5 block truncate font-mono-num text-slate-800">—</strong>
        </div>
        <div class="rounded-lg bg-slate-50 p-2.5">
          <span class="block text-slate-400">Phone</span>
          <strong id="judge-profile-phone" class="mt-0.5 block truncate font-mono-num text-slate-800">—</strong>
        </div>
      </div>
      <p id="judge-profile-fest" class="mt-4 truncate text-xs text-slate-400">Fest</p>
      <img id="judge-profile-logo" class="mx-auto mt-2 h-7 w-7 rounded object-cover hidden" alt="Fest logo" referrerpolicy="no-referrer">
    </article>
  </div>

  <script type="module" src="./judge.js"></script>
</body>
</html>
